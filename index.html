<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fábrica de Vídeos</title><style>body{background:#0b101b;color:#edf2ff;font:16px system-ui;margin:auto;max-width:850px;padding:24px}section{background:#151e30;border:1px solid #29364b;border-radius:18px;padding:22px;margin:18px 0}input,select,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #39475e;background:#0b101b;color:white;font:inherit}button{background:#635bff;border:0;font-weight:bold}a{color:#a9b5ff}video,img{max-width:100%;max-height:560px}small{color:#aab7cb}pre{white-space:pre-wrap}</style><h1>Fábrica de Vídeos</h1><small>E SE ACONTECER · ESTÚDIO LOCAL</small><section><h2>Novo vídeo</h2><label>Tema<input id="topic" placeholder="E se a Terra parasse de girar?"></label><label>Duração aproximada<select id="duration"><option>30</option><option selected>60</option><option>90</option><option>120</option></select></label><label>Formato<select id="format"><option value="1">Vertical · Shorts / TikTok</option><option value="0">Horizontal · YouTube</option></select></label><button id="go">Produzir vídeo</button></section><section><h2>Produção</h2><p id="status">Aguardando tema.</p><div id="result"></div></section><script>const $=id=>document.getElementById(id);$('go').onclick=async()=>{if(!$('topic').value.trim())return;$('go').disabled=true;$('result').replaceChildren();try{let r=await fetch('/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:$('topic').value,duration:+$('duration').value,vertical:$('format').value==='1'})});let {id}=await r.json();if(!id)throw Error('Não foi possível iniciar');let timer=setInterval(async()=>{try{let j=await (await fetch('/job/'+id)).json();$('status').textContent=j.status;if(j.done||j.error){clearInterval(timer);$('go').disabled=false}if(j.done){let v=document.createElement('video');v.controls=true;v.src='/videos/'+id+'/video.mp4';$('result').append(v);for(let [file,label] of [['video.mp4','Baixar MP4'],['thumbnail.jpg','Thumbnail'],['creditos.json','Fontes e créditos']]){let a=document.createElement('a');a.href='/videos/'+id+'/'+file;a.download=file;a.textContent=label;a.style.display='block';$('result').append(a)}let p=document.createElement('pre');p.textContent=j.script.titulo+'\n'+j.script.descricao+'\n\n'+j.script.cenas.map(s=>s.narracao).join('\n\n');$('result').append(p)}}catch(e){clearInterval(timer);$('status').textContent=e.message;$('go').disabled=false}},2000)}catch(e){$('status').textContent=e.message;$('go').disabled=false}};</script></html>
